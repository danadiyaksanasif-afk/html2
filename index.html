<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretv X One - AI Interface</title>

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- KaTeX CDN - buat render rumus matematika/LaTeX -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(15, 19, 32, 0.8);
      --panel-border: rgba(99, 102, 241, 0.18);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #06b6d4 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --user-msg-bg: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
      --ai-msg-bg: rgba(20, 26, 43, 0.6);
      --input-bg: rgba(13, 17, 28, 0.9);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus,
    input:focus,
    textarea:focus,
    select:focus,
    a:focus,
    div:focus,
    span:focus {
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    ::selection {
      background: rgba(168, 85, 247, 0.3);
      color: #ffffff;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 45%);
    }

    button, select, textarea { font: inherit; }

    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* SIDEBAR */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .sidebar {
      width: 280px;
      background: rgba(10, 13, 22, 0.95);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      z-index: 100;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: 1px;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  /* text-transform: uppercase; HAPUS ATAU KOMENTARI BARIS INI */
  display: flex;
  align-items: center;
  gap: 10px;
}

    .btn-new-chat {
      margin: 16px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid var(--panel-border);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .btn-new-chat:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: #6366f1;
    }

    .history-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin: 6px 16px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(99, 102, 241, 0.12);
      overflow: hidden;
    }

    .history-section-header {
      flex-shrink: 0;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(99, 102, 241, 0.1);
    }

    .history-section-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.74rem;
      font-weight: 600;
      color: #b4b9c6;
    }

    .history-section-title i {
      font-size: 0.7rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .history-section-count {
      font-size: 0.66rem;
      color: var(--text-muted);
      background: rgba(99, 102, 241, 0.12);
      padding: 1px 7px;
      border-radius: 20px;
      min-width: 16px;
      text-align: center;
    }

    .chat-history {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-item {
      position: relative;
      padding: 6px 8px;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.045);
    }

    .history-item.active {
      background: rgba(99, 102, 241, 0.12);
      border-color: rgba(99, 102, 241, 0.22);
    }

    .history-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 7px;
      bottom: 7px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent-gradient);
    }

    .history-item-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.58rem;
      color: #c7d2fe;
      background: rgba(99, 102, 241, 0.16);
      border: 1px solid rgba(99, 102, 241, 0.22);
    }

    .history-item.active .history-item-icon {
      background: var(--accent-gradient);
      color: #fff;
      border-color: transparent;
    }

    .history-item-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .history-item:hover .history-item-title,
    .history-item.active .history-item-title {
      color: #fff;
    }

    .history-item-action {
      position: relative;
      flex-shrink: 0;
      width: 24px;
      height: 18px;
    }

    .history-item-time,
    .history-item-delete {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease;
    }

    .history-item-time {
      font-size: 0.63rem;
      color: rgba(156, 163, 175, 0.65);
      justify-content: flex-end;
      pointer-events: none;
    }

    .history-item-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      opacity: 0;
      cursor: pointer;
      border-radius: 6px;
    }

    .history-item:hover .history-item-time {
      opacity: 0;
    }

    .history-item:hover .history-item-delete {
      opacity: 1;
    }

    .history-item-delete:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.14);
    }

    .history-empty {
      padding: 10px 8px;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-align: center;
      opacity: 0.5;
    }

    /* MAIN */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
    }

    .sidebar,
    .drawer,
    #sidebar {
      z-index: 9999 !important;
      background-color: #0c0d14 !important;
    }

    /* TOP BAR WITH CIRCULAR BUTTON BACKGROUNDS */
    .top-bar {
      position: fixed;
      top: 40px !important;
      left: 0;
      right: 0;
      height: auto !important;
      padding: 0 20px !important;
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      z-index: 10 !important;
      pointer-events: none;
    }

    .top-btn {
  pointer-events: auto !important;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  /* Menggunakan warna background gelap dan border ungu agar menyatu dengan tema */
  background: rgba(15, 19, 32, 0.8) !important;
  border: 1px solid rgba(99, 102, 241, 0.25) !important;
  color: #a5b4fc; /* Warna ikon dibuat sedikit keunguan */
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  cursor: pointer;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all 0.2s ease;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
}

.top-btn:hover {
  background: rgba(99, 102, 241, 0.15) !important;
  border-color: rgba(99, 102, 241, 0.4) !important;
  color: #ffffff;
  transform: scale(1.05);
}


    .top-btn:active {
      transform: scale(0.95);
    }

    .top-bar::before,
    .top-bar::after {
      display: none !important;
    }

    .messages-container {
      padding-top: 95px !important;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .welcome-screen {
      flex: 1;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .welcome-image {
  width: 58px;
  height: 58px;
  object-fit: cover;
  border-radius: 16px;
  margin-bottom: 8px;
  animation: floatLogo 1.5s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.5));
}
/* Keyframes */
@keyframes welcomeEntrance {
  0% { opacity: 0; transform: scale(0.9) translateY(30px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes floatLogo {
  0% { transform: translateY(0px) rotate(0deg); }
  100% { transform: translateY(-12px) rotate(2deg); }
}

@keyframes blinkCursor {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}


    .welcome-greeting {
      font-size: 1.55rem;
      font-weight: 700;
      background: linear-gradient(90deg, #ffffff, #a5b4fc, #c084fc, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-subtitle {
      max-width: 430px;
      padding: 0 20px;
      font-size: 0.88rem;
      line-height: 1.6;
      background: linear-gradient(90deg, #9ca3af, #c4b5fd, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* MESSAGES & ACTIONS */
    .message {
      max-width: 80%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; }
    .message.ai {
      align-self: flex-start;
      max-width: 100%; /* jawaban AI pakai lebar penuh, gak nyisain area kosong di kanan kayak bubble user */
    }

    .message-content {
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.user .message-content {
      background: var(--user-msg-bg);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-bottom-right-radius: 4px;
    }

    .message.ai .message-content {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 4px 0;
      backdrop-filter: none;
    }

    .message-img {
      max-width: 230px;
      max-height: 260px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 6px;
      border: 1px solid var(--panel-border);
    }

    .message-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      color: #8b93a5;
      font-size: 0.78rem;
      flex-wrap: wrap;
      opacity: 1;
      transition: opacity 0.25s ease;
    }

    .message.is-typing .message-actions {
      opacity: 0;
      pointer-events: none;
    }

    .typing-cursor {
      display: inline-block;
      width: 7px;
      height: 1em;
      margin-left: 2px;
      background: var(--accent-gradient);
      vertical-align: text-bottom;
      border-radius: 1px;
      animation: typingBlink 0.55s ease-in-out infinite;
    }

    @keyframes typingBlink {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .message-content.glitching {
      animation: glitchJitter 0.5s ease-in-out infinite;
    }

    @keyframes glitchJitter {
      0%   { opacity: 1; text-shadow: none; }
      50%  { opacity: 0.93; text-shadow: -1px 0 rgba(168, 85, 247, 0.4), 1px 0 rgba(6, 182, 212, 0.4); }
      100% { opacity: 1; text-shadow: none; }
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 12px 0;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
    }

    .message-content table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .message-content th,
    .message-content td {
      padding: 9px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(99, 102, 241, 0.14);
      white-space: normal;
      word-break: normal;
      overflow-wrap: break-word;
      vertical-align: top;
      min-width: 110px;
    }

    .message-content th {
      background: rgba(99, 102, 241, 0.14);
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
    }

    .message-content tr:last-child td {
      border-bottom: none;
    }

    .message-content tbody tr:nth-child(even) td {
      background: rgba(255, 255, 255, 0.02);
    }

    .action-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      font-size: 0.78rem;
    }

    .action-link:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .action-link i {
      font-size: 0.82rem;
    }

    .feedback-btn.active {
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.35);
    }

    /* COMPOSER */
    .composer-container {
      padding: 16px 24px 24px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .input-box {
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s ease;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
    }

    .input-box:focus-within {
      border-color: #6366f1;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
    }

    .image-preview-wrapper {
      display: none;
      position: relative;
      width: fit-content;
      margin-bottom: -4px;
    }

    .image-preview-wrapper img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
    }

    .btn-remove-img {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    textarea {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1rem;
      resize: none;
      outline: none;
      min-height: 28px;
      max-height: 150px;
      padding: 0 4px;
      width: 100%;
    }

    textarea::placeholder { color: #6b7280; }

    .composer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .btn-plus {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s ease;
    }

    .btn-plus:hover { background: rgba(255, 255, 255, 0.2); }

    .model-selector-button {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 16px;
      outline: none;
      font-size: 0.85rem;
      cursor: pointer;
      max-width: 190px;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .model-selector-button:hover,
    .model-selector-button.active {
      color: #fff;
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.1);
    }

    .model-selector-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-chevron {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-send {
      background: #fff;
      border: none;
      color: #000;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
    }

    .btn-send svg {
      stroke: #000;
      width: 18px;
      height: 18px;
    }

    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-stop {
      background: var(--danger);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    /* MODEL BOTTOM SHEET */
    .model-sheet-overlay,
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .model-sheet-overlay.active,
    .sheet-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .model-bottom-sheet,
    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel-bg);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      z-index: 1000;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 12px 24px 32px;
      border-top: 1px solid var(--panel-border);
      box-shadow: 0 -4px 18px rgba(0,0,0,0.28);
      max-height: 88vh;
      overflow-y: auto;
    }

    .model-bottom-sheet.open,
    .bottom-sheet.open {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      margin: 0 auto 16px;
    }

    .model-sheet-header,
    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      position: relative;
    }

    .model-sheet-header h4,
    .sheet-header h4 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .model-sheet-close,
    .sheet-header .icon-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      z-index: 2;
    }

    .sheet-header-spacer {
      width: 32px;
      height: 32px;
    }

    .model-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .model-option {

    }

    function saveChatSessions() {
      for (let attempt = 0; attempt < 15; attempt++) {
        try {
          localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(chatSessions));
          return;
        } catch (error) {
          const isQuotaError = error && (error.name === 'QuotaExceededError' || error.code === 22);
          if (!isQuotaError) {
            console.error('Gagal menyimpan riwayat chat:', error);
            return;
          }
          // Penyimpanan HP penuh: buang gambar dari chat terlama satu per satu (teksnya tetap disimpan), lalu coba lagi
          if (!dropOldestStoredImage()) {
            alert('Penyimpanan HP sudah penuh. Hapus beberapa riwayat chat lama agar chat baru bisa tersimpan.');
            return;
          }
        }
      }
    }

    function dropOldestStoredImage() {
      const sorted = [...chatSessions].sort((a, b) => a.updatedAt - b.updatedAt);
      for (const session of sorted) {
        const target = session.messages.find(m => m.image);
        if (target) {
          target.image = null;
          return true;
        }
      }
      return false;
    }

    function generateChatTitle(messages) {
      const firstUserMsg = messages.find(msg => msg.role === 'user' && msg.text);
      if (!firstUserMsg) return 'Percakapan Baru';
      const text = firstUserMsg.text.trim();
      return text.length > 40 ? text.slice(0, 40) + '...' : text;
    }

    function persistCurrentChat() {
      if (!currentChatId || currentChatMessages.length === 0) return;
      let session = chatSessions.find(s => s.id === currentChatId);
      if (session) {
        session.messages = currentChatMessages;
        session.title = generateChatTitle(currentChatMessages);
        session.updatedAt = Date.now();
      } else {
        session = {
          id: currentChatId,
          title: generateChatTitle(currentChatMessages),
          messages: currentChatMessages,
          updatedAt: Date.now()
        };
        chatSessions.unshift(session);
      }
      saveChatSessions();
      renderChatHistoryList();
    }

    function formatRelativeTime(timestamp) {
      const diffMin = Math.floor((Date.now() - timestamp) / 60000);
      if (diffMin < 1) return 'Baru';
      if (diffMin < 60) return diffMin + 'm';
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return diffHour + 'j';
      const diffDay = Math.floor(diffHour / 24);
      if (diffDay === 1) return 'Kemarin';
      if (diffDay < 7) return diffDay + 'h';
      const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      const date = new Date(timestamp);
      return date.getDate() + ' ' + bulan[date.getMonth()];
    }

  let phraseIndex = 0;

  function typeLoop() {
    const currentPhrase = phrases[phraseIndex];

    if (isDeleting) {
      element.textContent = currentPhrase.substring(0, charIndex - 1);
      charIndex--;
    } else {
      element.textContent = currentPhrase.substring(0, charIndex + 1);

    function compressImageFile(file, maxDimension = 1280, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round(height * (maxDimension / width));
                width = maxDimension;
              } else {
                width = Math.round(width * (maxDimension / height));
                height = maxDimension;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => reject(new Error('Gagal memuat gambar'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Gagal membaca file gambar'));
        reader.readAsDataURL(file);
      });
    }

    async function callGemini(modelConfig, prompt, imageBase64, signal) {
      const endpoint = modelConfig.endpoint.replace(/\/+$/, '');
      const modelId = modelConfig.model_id.replace(/^models\//, '').replace(/\/+$/, '');
      const url = `${endpoint}/${modelId}:generateContent?key=` + encodeURIComponent(modelConfig.api_key);

      const parts = [];
      if (prompt) parts.push({ text: `${getResponseModeInstruction()}\n\nPertanyaan pengguna:\n${prompt}` });
      if (imageBase64) {
        const mimeMatch = imageBase64.match(/^data:([^;]+);base64,/);
        if (mimeMatch) {
          parts.push({
            inline_data: { mime_type: mimeMatch[1], data: imageBase64.split(',')[1] }
          });
        }
      }

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: signal,
        body: JSON.stringify({ contents: [{ role: 'user', parts: parts }] })
      });

      const json = await response.json();
      if (!response.ok) throw new Error(json?.error?.message || `HTTP ${response.status}`);
      return json.candidates[0].content.parts.filter(p => typeof p.text === 'string').map(p => p.text).join('');
    }

    async function callOpenAICompatible(modelConfig, history, signal) {
      const messages = history.map(msg => {
        const role = msg.role === 'assistant' ? 'assistant' : 'user';
        const textContent = msg.text ? `${getResponseModeInstruction()}\n\n${msg.text}` : '';

        if (msg.image) {
          const content = [];
          if (textContent) content.push({ type: 'text', text: textContent });
          content.push({ type: 'image_url', image_url: { url: msg.image } });
          return { role, content };
        }

        return { role, content: textContent };
      });

      const response = await fetch(modelConfig.endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${modelConfig.api_key}`
        },
        signal: signal,
        body: JSON.stringify({ model: modelConfig.model_id, messages: messages })
      });

      const json = await response.json();
      if (!response.ok) throw new Error(json?.error?.message || `HTTP ${response.status}`);
      return json?.choices?.[0]?.message?.content || '';
    }

    function typeWriterEffect(msgDiv, fullText) {
      return new Promise(resolve => {
        const contentEl = msgDiv.querySelector('.message-content');
        const container = document.getElementById('messagesContainer');
        // Reveal per kata (bukan per karakter) biar gak ada kata kepotong di tengah pas lagi animasi
        const chunks = fullText.match(/\S+\s*/g) || [fullText];
        const TOTAL_STEPS = Math.min(chunks.length, 26); // dibatasi biar teks panjang tetap gak kelamaan
        const chunksPerTick = Math.max(1, Math.ceil(chunks.length / TOTAL_STEPS));
        const TICK_DELAY = 42; // ms - lebih santai dari versi sebelumnya, tapi tetap gak selambat awal
        let chunkIndex = 0;
        let done = false;

        contentEl.classList.add('glitching');

        function shownTextUpTo(count) {
          return chunks.slice(0, count).join('');
        }

        function finalize(count) {
          if (done) return;
          done = true;
          if (activeTypingStop === stopHandler) activeTypingStop = null;
          const shownText = shownTextUpTo(count);
          msgDiv.classList.remove('is-typing');
          contentEl.classList.remove('glitching');
          contentEl.innerHTML = renderMessageHtml(shownText);
          container.scrollTop = container.scrollHeight;
          resolve(shownText);
        }

        function stopHandler() {
          // Dipotong di posisi sekarang, sisa kata setelahnya dibuang (tidak diselesaikan)
          finalize(chunkIndex);
        }

        activeTypingStop = stopHandler;

        function tick() {
          if (done) return;
          chunkIndex += chunksPerTick;
          if (chunkIndex >= chunks.length) {
            finalize(chunks.length);
            return;
          }
          contentEl.innerHTML = renderMessageHtml(shownTextUpTo(chunkIndex)) + '<span class="typing-cursor"></span>';
          container.scrollTop = container.scrollHeight;
          setTimeout(tick, TICK_DELAY);
        }

        tick();
      });
    }

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderMathToken(rawFormula, displayMode) {
      if (typeof katex === 'undefined') return null;
      try {
        return katex.renderToString(rawFormula.trim(), { throwOnError: false, displayMode });
      } catch (error) {
        return null;
      }
    }

    function renderMessageHtml(text) {
      if (!text) return '';

      // 1) Cari & render rumus LaTeX DULUAN (sebelum masuk markdown), soalnya markdown suka
      //    ngilangin backslash di depan ( ) [ ] { } sehingga rumusnya rusak/kepotong.
      const mathTokens = [];
      function extractMath(source, pattern, displayMode) {
        return source.replace(pattern, (match, formula) => {
          const rendered = renderMathToken(formula, displayMode);
          if (rendered === null) return match; // gagal render, biarkan apa adanya
          const token = `@@KMATH${mathTokens.length}@@`;
          mathTokens.push(rendered);
          return token;
        });
      }

      let working = text;
      working = extractMath(working, /\\\[([\s\S]+?)\\\]/g, true);   // \[ ... \]  (blok)
      working = extractMath(working, /\$\$([\s\S]+?)\$\$/g, true);   // $$ ... $$  (blok)
      working = extractMath(working, /\\\(([\s\S]+?)\\\)/g, false);  // \( ... \)  (inline)

      // 2) baru render markdown seperti biasa
      let html = (typeof marked === 'undefined') ? escapeHtml(working) : marked.parse(working);

      // Bungkus tabel dengan div yang bisa di-scroll horizontal biar kolomnya gak kegencet/kepotong di layar sempit
      html = html.replace(/<table>/g, '<div class="table-scroll"><table>').replace(/<\/table>/g, '</table></div>');

      // 3) kembalikan rumus yang sudah dirender KaTeX ke posisi aslinya
      mathTokens.forEach((renderedHtml, i) => {
        html = html.split(`@@KMATH${i}@@`).join(renderedHtml);
      });

      return html;
    }

    async function copyToClipboard(button) {
      const content = button.closest('.message').querySelector('.message-content').innerText;
      try {
        await navigator.clipboard.writeText(content);
        const original = button.innerHTML;
        button.innerHTML = '<i class="fa-solid fa-check"></i><span>Tersalin!</span>';
        setTimeout(() => { button.innerHTML = original; }, 2000);
      } catch (error) {
        alert('Gagal menyalin teks.');
      }
    }

    function stopGenerating() {
      if (abortController) abortController.abort();
      if (activeTypingStop) activeTypingStop();
      setLoadingState(false);
    }

    function setLoadingState(isLoading) {
      document.getElementById('btnSend').style.display = isLoading ? 'none' : 'flex';
      document.getElementById('btnStop').style.display = isLoading ? 'flex' : 'none';
    }

    function openCameraInfo() {
      toggleBottomSheet();
      alert('Kamera menggunakan fitur kamera perangkat.');
    }

    function showProjectInfo() { alert('Fitur proyek belum dikonfigurasi.'); }
    function showToolsInfo() { alert('Akses alat masih mengikuti konfigurasi Admin Control.'); }
    function showOtherModelsInfo() { alert('Model lainnya akan mengikuti model aktif yang ditambahkan melalui Admin Control.'); }

    function toggleWebSearch() {
      const checkbox = document.getElementById('webSearchToggle');
      checkbox.checked = !checkbox.checked;
      webSearchEnabled = checkbox.checked;
    }

    function showThinking() {
      const container = document.getElementById('messagesContainer');
      const thinking = document.createElement('div');
      thinking.className = 'message ai';
      thinking.id = 'thinkingMessage';
      thinking.innerHTML = `
        <div class="ai-thinking">
          <div class="thinking-icon"></div>
          <span>AI sedang berpikir</span>
          <div class="thinking-dots">
            <span></span><span></span><span></span>
          </div>
        </div>
      `;
      container.appendChild(thinking);
      container.scrollTop = container.scrollHeight;
    }

    function removeThinking() {
      const thinking = document.getElementById('thinkingMessage');
      if (thinking) thinking.remove();
    }

    function speakMessage(button) {
      const content = button.closest('.message').querySelector('.message-content').innerText;
      if (!content) return;

      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(content);
        speech.lang = 'id-ID';
        speech.rate = 1;
        speechSynthesis.speak(speech);

        button.innerHTML = '<i class="fa-solid fa-volume-high"></i><span>Berbicara...</span>';
        speech.onend = () => {
          button.innerHTML = '<i class="fa-solid fa-volume-high"></i><span>Suara</span>';
        };
      } else {
        alert('Fitur suara tidak didukung perangkat ini.');
      }
    }

    function giveFeedback(button, type) {
      const parent = button.parentElement;
      parent.querySelectorAll('.feedback-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    }

    let deepResearchEnabled = false;
    function toggleDeepResearch(enabled) {
      deepResearchEnabled = enabled;
      responseMode = enabled ? 'deep' : 'short';
    }
  </script>
</body>
</html>
